name: LinkedIn DSA Daily Digest

on:
  schedule:
    # Runs everyday at 16:00 UTC (9:30 PM IST)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (validate & preview without publishing)'
        required: false
        default: false
        type: boolean
      hours:
        description: 'Lookback window in hours'
        required: false
        default: '24'
        type: string

jobs:
  linkedin-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository with full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute LinkedIn Daily Digest Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          HOURS_INPUT: ${{ github.event.inputs.hours }}
        run: |
          FLAGS=""
          if [ "$DRY_RUN_INPUT" = "true" ] || [ -z "$LINKEDIN_ACCESS_TOKEN" ]; then
            FLAGS="--dry-run"
          fi
          LOOKBACK="${HOURS_INPUT:-24}"

          python scripts/linkedin_daily_digest.py \
            --repo-root . \
            --hours "$LOOKBACK" \
            $FLAGS
